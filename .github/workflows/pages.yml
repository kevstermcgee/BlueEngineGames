name: Deploy download site

on:
  workflow_run:
    workflows: ["Build Windows releases"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # On workflow_run, only deploy after a successful release build.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: build.py derives each game's "added" date from git.
          fetch-depth: 0

      - name: Fetch latest release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/latest > release.json
          if ! jq -e '[.assets[].name | select(endswith("-setup-windows-x64.exe"))] | length > 0' release.json > /dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Keeping the current site until installer downloads are published."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          tag=$(jq -r .tag_name release.json)
          # The old filename is a migration fallback until the first new release completes.
          curl -fsSL -o catalog.tsv \
            "https://github.com/${{ github.repository }}/releases/download/$tag/Games-catalog.tsv" || \
          curl -fsSL -o catalog.tsv \
            "https://github.com/${{ github.repository }}/releases/download/$tag/BlueEngineLauncher-catalog.tsv"
          gh api --paginate --slurp repos/${{ github.repository }}/releases | jq 'add' > releases.json

      - name: Build site
        if: steps.metadata.outputs.ready == 'true'
        run: python3 site/build.py --catalog catalog.tsv --release-json release.json --releases-json releases.json --games-dir games --thumbs site/thumbs --out _site

      - uses: actions/configure-pages@v5
        if: steps.metadata.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.metadata.outputs.ready == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.metadata.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
