name: Build Windows releases

on:
  pull_request:
    paths:
      - .games-catalog.json
      - .release-games.json
      - games/**
      - distribution/**
      - site/**
      - .github/scripts/**
      - .github/workflows/releases.yml
  push:
    branches: [main]
    paths:
      - .games-catalog.json
      - .release-games.json
      - games/**
      - distribution/**
      - .github/scripts/**
      - .github/workflows/releases.yml
  workflow_dispatch:
    inputs:
      checks_only:
        description: Run distribution checks without rebuilding game downloads
        type: boolean
        default: false
      game_slug:
        description: Build one native game's installer for review (never publishes a partial release)
        type: string
        default: ''
      backfill_limit:
        description: Package installers for this many historical releases (0 disables)
        type: string
        default: '0'
      publish_archives:
        description: Add the archived installers to their existing GitHub releases
        type: boolean
        default: false

concurrency:
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  distribution-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate every game has a download definition
        run: |
          python distribution/check_catalog.py
          python -m unittest discover -s distribution -p test_*.py
      - name: Test updater and download history
        shell: pwsh
        run: |
          distribution/test_updater.ps1
          python -m unittest discover -s site -p test_*.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Test Windows installation, upgrade and uninstall
        shell: pwsh
        run: distribution/test_installers.ps1

  archived-installers:
    needs: distribution-checks
    if: github.event.inputs.backfill_limit != '' && github.event.inputs.backfill_limit != '0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package archived Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit }}
          PUBLISH_ARCHIVES: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish_archives == 'true' }}
        run: .github/scripts/backfill_installers.ps1 -ReleaseLimit ([int]$env:BACKFILL_LIMIT) -Publish:($env:PUBLISH_ARCHIVES -eq 'true')
      - name: Save archived installers for review
        uses: actions/upload-artifact@v4
        with:
          name: archived-installers
          path: dist/backfill/
          retention-days: 7

  windows:
    needs: distribution-checks
    if: github.event_name != 'pull_request' && github.event.inputs.checks_only != 'true' && (github.event.inputs.backfill_limit == '' || github.event.inputs.backfill_limit == '0')
    runs-on: windows-latest
    steps:
      - name: Check out the games catalog
        uses: actions/checkout@v7

      - name: Read source revision
        id: catalog
        shell: pwsh
        run: |
          $catalog = Get-Content -Raw .games-catalog.json | ConvertFrom-Json
          $short = $catalog.source_revision.Substring(0, 12)
          "source_repository=$($catalog.source_repository)" >> $env:GITHUB_OUTPUT
          "source_revision=$($catalog.source_revision)" >> $env:GITHUB_OUTPUT
          $gamesShort = $env:GITHUB_SHA.Substring(0, 12)
          "tag=blueengine-$short-games-$gamesShort-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "title=BlueEngine games ($gamesShort / engine $short)" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=blueengine-$short-games-$gamesShort-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV

      - name: Check out the exact BlueEngine source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.catalog.outputs.source_repository }}
          ref: ${{ steps.catalog.outputs.source_revision }}
          path: _engine
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Dependencies (physics, math, rendering) change only when a Cargo.lock does, so restore them
      # from the last run. The engine's own target dir and the games' shared one are both cached.
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            _engine\target
            ${{ runner.temp }}\cargo-target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build BlueEngine for Windows
        if: github.event.inputs.game_slug == ''
        working-directory: _engine
        run: cargo build --release --locked --bin be2

      - name: Package playable downloads
        if: github.event.inputs.game_slug == ''
        shell: pwsh
        run: .github/scripts/package_releases.ps1 -EngineExe _engine/target/release/be2.exe -EngineName BlueEngine.exe -ProductName BlueEngine

      - name: Prepare selected game output
        if: github.event.inputs.game_slug != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Set-Content dist/release-notes.md 'Selected game installer for review; not a published release.'

      - name: Build and package native game downloads
        shell: pwsh
        env:
          # One target directory for all games: games with the same engine, features and profile
          # compile the engine and its dependencies once instead of once per game.
          CARGO_TARGET_DIR: ${{ runner.temp }}\cargo-target
          GAME_SLUG: ${{ github.event.inputs.game_slug }}
        run: .github/scripts/package_native_releases.ps1 -EngineRoot _engine -GameSlug "$env:GAME_SLUG"

      - name: Build release catalog
        shell: pwsh
        env:
          GAME_SLUG: ${{ github.event.inputs.game_slug }}
        run: distribution/build_catalog.ps1 -GameSlug "$env:GAME_SLUG"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build game installers
        shell: pwsh
        run: .github/scripts/package_installers.ps1

      - name: Save reviewable Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: dist/
          retention-days: 7

      # Branch runs (workflow_dispatch on a branch) build and package everything but never publish.
      - name: Create or update the GitHub Release
        if: github.ref == 'refs/heads/main' && github.event.inputs.game_slug == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.catalog.outputs.tag }}
          RELEASE_TITLE: ${{ steps.catalog.outputs.title }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object Name -ne 'release-notes.md' | ForEach-Object FullName)
          # Every build gets a new tag; release history is never overwritten.
          gh release create $env:RELEASE_TAG $assets --target $env:GITHUB_SHA --title $env:RELEASE_TITLE --notes-file dist/release-notes.md --latest
