name: Build Windows launcher
on:
  push:
    branches: [main]
    paths:
      - launcher/**
      - site/launcher_feed.py
      - site/feedback.mjs
      - site/feedback.css
      - site/feedback.test.mjs
      - .github/workflows/launcher.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Windows installer and update the website
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: windows-launcher
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify standard Windows user can open a desktop app
        shell: pwsh
        run: ./launcher/prepare-upgrade-user.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          cache-on-failure: true
      - name: Install frontend tools
        working-directory: launcher
        run: npm ci
      - name: Verify library filters and native installation transactions
        working-directory: launcher
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked round_trip -- --ignored
      - name: Build per-user installer and signed app update
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -- build --bundles nsis
      - name: Extract exact signed installer payload for upgrade verification
        shell: pwsh
        run: |
          $config = Get-Content launcher/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($config.plugins.updater.dangerousInsecureTransportProtocol -or $config.app.windows[0].additionalBrowserArgs) { throw 'Production configuration must not enable CI transport or debugging' }
          # Tauri patches a bundle-type marker into the packaged EXE, then restores
          # the raw target/release EXE. Compare against the signed installer payload.
          $installer = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $payload = Join-Path $env:RUNNER_TEMP 'BlueEngine-Games-production-payload'
          & 'C:\Program Files\7-Zip\7z.exe' x $installer.FullName "-o$payload" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the signed installer payload for verification' }
          $main = @(Get-ChildItem $payload -Recurse -Filter 'blueengine-games-launcher.exe')
          if ($main.Count -ne 1) { throw 'Expected exactly one launcher executable in the signed installer' }
          Copy-Item $main[0].FullName (Join-Path $env:RUNNER_TEMP 'BlueEngine-Games-production.exe')
      - name: Build isolated WebView instrumentation for Windows UI checks
        working-directory: launcher
        # Wry overrides WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS. Only this separate
        # older executable gets a CDP port and loopback HTTP feed. The signed
        # production NSIS bundle above retains its HTTPS endpoint and real version.
        run: npm run tauri -- build --no-bundle --config src-tauri/tauri.ci.conf.json
      - name: Verify Windows library and real signed launcher upgrade
        shell: pwsh
        run: ./launcher/smoke-upgrade.ps1
      - name: Remove temporary Windows test account
        if: always()
        shell: pwsh
        run: |
          if (Get-LocalUser -Name BlueEngineCI -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name BlueEngineCI
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlueEngine-Games-Windows-x64
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/bundle/nsis/*.sig
            launcher-smoke/*.png
            launcher-smoke/*.json
            launcher-smoke/*.log
      - name: Publish installer and signed update metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content launcher/package.json | ConvertFrom-Json).version
          $tag = "launcher-v$version"
          $built = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $published = Join-Path $env:RUNNER_TEMP 'BlueEngine-Games-Setup-x64.exe'
          Copy-Item $built.FullName $published
          Copy-Item "$($built.FullName).sig" "$published.sig"
          $installer = Get-Item $published
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($installer.Name)"
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $update = @{version=$version; notes='Every game guide now includes a feedback center: rate games out of 10, share what you enjoyed or would improve, save a draft, and post your review to the BlueEngine repository through GitHub. Includes public review summaries, whole-library Update all and signed launcher updates.'; pub_date=$date; platforms=@{'windows-x86_64'=@{url=$url; signature=$signature.Trim()}}}
          $update | ConvertTo-Json -Depth 6 | Set-Content launcher-update.json -Encoding utf8NoBOM
          "$hash  $($installer.Name)" | Set-Content LAUNCHER-SHA256SUMS.txt -Encoding ascii
          gh release create $tag $installer.FullName "$($installer.FullName).sig" launcher-update.json LAUNCHER-SHA256SUMS.txt --repo ${{ github.repository }} --target ${{ github.sha }} --title "BlueEngine Games Launcher $version" --notes "Leave a review from every game guide: score the game out of 10 and describe what worked or could be better. Drafts stay on your device; GitHub sign-in is required to publish public reviews to the BlueEngine repository for future IdeaForge improvements. View public ratings and recent reviews in the guide. Update all installed games from My library or Updates with one click. Checks the latest releases across the whole library, queues downloads, skips running games and preserves saves. Automatically detects launcher updates and lets you choose when to install and restart, with game activity protected. Includes a collapsible sidebar, game guides, design credits, screenshots, favorites, a download queue and offline installed play. Windows may show a reputation warning for this unsigned installer. Game downloads are verified against pinned SHA256 values; launcher updates require a valid signing key." --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing versions are never overwritten' }
          $metadata = @{version=$version; url=$url; sha256=$hash; size=$installer.Length; update=$update}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B launcher-release-site origin/main
          $metadata | ConvertTo-Json -Depth 8 | Set-Content site/launcher-release.json -Encoding utf8NoBOM
          git add site/launcher-release.json
          git commit -m "Publish Windows launcher $version download and signed update feed"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Installer is published; retry the site metadata commit after resolving concurrent main updates' }
