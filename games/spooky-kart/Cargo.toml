[package]
name = "spooky-kart"
version = "0.1.0"
edition = "2021"
description = "Spooky Kart: Collect the glowing orbs and stay off the void."

# The rules are a plain library so they can be tested without a window; the window is the binary.
[lib]
name = "spooky_kart"
path = "src/lib.rs"

[features]
default = ["client"]
client = ["vesper3d/client", "dep:macroquad", "dep:windows-sys"]

[[bin]]
name = "spooky-kart"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "spooky-kart-server"
path = "src/bin/spooky-kart-server.rs"

[[bin]]
name = "spooky-kart-bots"
path = "src/bin/spooky-kart-bots.rs"

# The agent environment: headless, no window, no network (no required-features).
[[bin]]
name = "spooky-kart-env"
path = "src/bin/spooky-kart-env.rs"

[dependencies]
vesper3d = { package = "be2", path = "../../../BlueEngine", default-features = false }
macroquad = { optional = true, version = "=0.4.14", default-features = false, features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

# A frame here is real work (mesh building, effects), so debug builds must stay playable for captures
# and scripted runs: the game at opt-level 2, dependencies at 3.
[profile.dev]
opt-level = 2
debug = 1
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
